name: coolify-demo

services:
  api:
    build:
      context: ./api
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8081,http://localhost:8081}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      API_URL: ${API_URL:-http://127.0.0.1:8080}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
